# Uptime check for kitpier.com during judging: every 10 minutes, the home page and /judges must load and show Kitpier.
# A failed run makes GitHub email the repo owner (Settings → Notifications → Actions: failed workflows).
# The pings also keep Render's free instance awake, so judges don't wait for a cold start.
name: Uptime
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check kitpier.com
        run: |
          for path in / /judges; do
            body=$(curl --fail -sS -L --retry 3 --retry-delay 20 --retry-all-errors --max-time 60 "https://kitpier.com$path") \
              || { echo "::error::https://kitpier.com$path did not load"; exit 1; }
            grep -qi kitpier <<<"$body" || { echo "::error::https://kitpier.com$path loaded but doesn't look like Kitpier"; exit 1; }
            echo "ok $path"
          done
